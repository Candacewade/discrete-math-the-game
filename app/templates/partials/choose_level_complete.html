{% if level_complete %}
  <div class="level-complete">
    ✅ Final level complete! You hit a {{ level_target }}-in-a-row streak.
    <a class="next-link" href="/levels">Back to Levels →</a>
  </div>
{% else %}
  <div class="level-incomplete muted">
    Goal: get {{ level_target }} correct in a row to complete this level.
  </div>
{% endif %}
